<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jenn's Cozy Town</title>
<link rel="stylesheet" href="./src/street.css">
<style>
:root{--ink:#4a3b4f;--panel:rgba(255,246,250,.88);--accent:#e98fb0;--mint:#8fd9c0}
html,body{margin:0;height:100%;overflow:hidden;background:#f6e3ec;font:13px/1.35 system-ui,Segoe UI,sans-serif;color:var(--ink)}
canvas#gl{display:block;width:100vw;height:100vh}
#ui{position:fixed;left:12px;top:12px;background:var(--panel);border-radius:14px;padding:10px 12px;display:grid;gap:8px;width:250px;box-shadow:0 4px 18px rgba(120,60,90,.18);backdrop-filter:blur(6px)}
#ui label{display:grid;gap:3px;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
select,input,button{font:inherit;color:var(--ink);border:1px solid #e3c9d6;border-radius:9px;padding:6px 8px;background:#fff}
button{cursor:pointer;background:var(--mint);border-color:#6cc2a6;font-weight:600}
button.alt{background:#fff}button:hover{filter:brightness(1.05)}
.row{display:flex;gap:6px}.row>*{flex:1}
#blurb{font-size:12px;opacity:.85}#info{font-size:11px;opacity:.7}
#mini{position:fixed;right:12px;bottom:12px;width:208px;height:208px;border-radius:12px;box-shadow:0 4px 18px rgba(120,60,90,.25);overflow:hidden;background:#fff}
#mini canvas{position:absolute;inset:0;width:100%;height:100%}
#busy{position:fixed;inset:0;display:grid;align-content:center;justify-items:center;gap:12px;background:rgba(255,240,246,.78);font-size:16px;font-weight:600}
body.shot #ui,body.shot #mini{display:none}
</style></head><body>
<canvas id="gl"></canvas>
<div id="ui">
  <button id="walk-street">Walk in Harbor Town</button>
  <label>Locale<select id="preset"></select></label>
  <label>Seed<div class="row"><input id="seed" value="petalwood" spellcheck="false"><button id="reroll" title="New random seed">Re-roll</button></div></label>
  <div class="row"><button class="alt" data-view="oblique">Oblique</button><button class="alt" data-view="top">Top</button><button class="alt" data-view="shore">Shore</button><button class="alt" data-view="town">Town</button></div>
  <div id="blurb"></div><div><a href="docs/DEVLOG.html" style="color:inherit">Devlog</a></div><div id="info"></div>
</div>
<div id="mini"><canvas id="mapc" width="208" height="208"></canvas><canvas id="mapo" width="208" height="208"></canvas></div>
<div id="street-panel" hidden>
  <header class="street-hud"><h1 id="place">Harbor Town</h1><p><span id="party">Your street</span> · Jenn's Cozy Town</p><p id="waypoint" hidden><b id="bearing" aria-hidden="true">↑</b> <span id="range"></span></p></header>
  <div id="walk-pad" aria-label="Walk"><div id="pad-stick"></div></div>
  <div id="world-choice" hidden><button id="world-action" class="primary"></button> <button id="world-dismiss" aria-label="Dismiss action">×</button></div>
  <section class="street-actions" aria-label="Street controls">
    <div id="live-action" hidden><span></span> <button id="order-chowder" hidden>Order chowder</button> <button id="order-fish" hidden>Order grilled fish</button> <button id="cancel-action">Cancel</button></div>
    <button id="reconnect-street" hidden>Reconnect to owner</button>
    <div class="street-buttons"><select id="patio-destination" aria-label="Terrace table for coffee" hidden></select><button class="primary" id="patio-coffee" hidden>Coffee on the terrace</button><button class="primary" id="beach-action" hidden>Walk to the beach</button><button class="primary" id="coffee-action" hidden>Coffee with a neighbor</button><button id="use-place" hidden>Interact</button><button id="directions-open">Find a place</button><button id="build-open">Build</button><button id="social-open">Multiplayer</button><button id="island-map">Island map</button></div>
    <div id="directions-pane" class="street-drawer" hidden><label>Walk to <select id="destination"></select></label> <button id="go-place" disabled>Walk there</button> <button id="home-invite" class="primary" hidden>Visit Bea for tea</button> <button id="dinner-visit" class="primary" hidden>Take a table</button></div>
    <div id="build-pane" class="street-drawer" hidden><label>Renovate <select id="build-lot"></select></label><div id="wall-tools"><label><span id="wall-label">Partition</span><input type="range" id="wall-offset" min="-1.5" max="1.5" step=".5" value="0"><output id="wall-readout">0.0 m</output></label>
      <label id="side-tools" hidden>Right wall <input type="range" id="side-offset" min="-1.5" max="1.5" step=".5" value="0"><output id="side-readout">0.0 m</output></label>
      <p id="wall-limit" role="status" hidden></p>
      <div><button id="apply-wall">Move wall and door</button> <button id="undo-wall">Undo</button></div></div>
      <button id="terrace-open" hidden>Furnish café terrace</button>
      <div id="terrace-tools" hidden><label>Furniture <select id="terrace-slot"></select></label>
        <p id="terrace-status" role="status"></p>
        <div><button id="terrace-rotate">Rotate</button> <button id="terrace-apply" class="primary">Place table</button> <button id="terrace-remove">Remove</button> <button id="terrace-undo">Undo table edit</button></div>
      </div></div>
    <div id="social-pane" class="street-drawer" hidden><div id="owner-room"><button id="copy-street">Invite a guest</button><input id="invite-url" aria-label="Street invite link" readonly hidden><label><input type="checkbox" id="list-street">List my street publicly</label></div>
      <button id="browse-streets">Browse listed streets</button><div id="room-results"></div></div>
    <p id="street-note" aria-live="polite"></p><small class="desktop-hint" id="walk-hint">WASD to walk · Drag to orbit · E to interact</small>
  </section>
  <button id="wall-grip" aria-label="Drag wall and doorway" title="Drag to move the wall" hidden>↕ <span>Drag wall</span></button>
</div>
<div id="busy" role="status">Opening Jenn’s Cozy Town…</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<script type="module">
const busy=document.getElementById('busy'),retryKey='cozy.startup-retry';
try{
  const game=await import('./src/main.js');
  await game.startup;
  try{sessionStorage.removeItem(retryKey);}catch{}
}catch(error){
  console.error('Could not start Jenn’s Cozy Town',error);
  busy.style.display='grid';
  let retry=false;
  if(error instanceof TypeError||error instanceof SyntaxError){
    try{
      retry=Date.now()-Number(sessionStorage.getItem(retryKey))>120000;
      if(retry)sessionStorage.setItem(retryKey,String(Date.now()));
    }catch{}
  }
  if(retry){busy.textContent='Reopening the town…';setTimeout(()=>location.reload(),1200);}
  else{
    busy.textContent='The town could not open.';
    const button=document.createElement('button');button.textContent='Try again';
    button.onclick=()=>location.reload();busy.append(button);
  }
}
</script>
</body></html>
