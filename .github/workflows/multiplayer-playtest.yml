name: Waterfront multiplayer playtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiplayer-playtest.yml'
      - 'packages/net/**'
      - 'index.html'
      - 'src/main.js'
      - 'src/public-town.js'
      - 'src/public-parcels.js'
      - 'src/address-menu.js'
      - 'tools/playtest-addresses.mjs'
      - 'src/player-*.js'
      - 'tools/playtest-players.mjs'
      - 'src/private-saves.js'
      - 'src/private-routes.js'
      - 'src/visit-admission.js'
      - 'tools/playtest-admission.mjs'
      - 'tools/playtest-band.mjs'
      - 'src/piano*.js'
      - 'src/save-menu.js'
      - 'tools/test-domestic.mjs'
      - 'tools/playtest-recovery.mjs'
      - 'tools/playtest-furnishing.mjs'
      - 'tools/playtest-lighting.mjs'
      - 'tools/playtest-studio.mjs'
      - 'tools/playtest-flowers.mjs'
      - 'src/roadside-flowers.js'
      - 'src/flower-art.js'
      - 'src/easel-art.js'
      - 'tools/playtest-table.mjs'
      - 'src/table-*.js'
      - 'src/home-*.js'
      - 'src/resident-worker.js'
      - 'src/resident-world.js'
      - 'src/furni*.js'
      - 'src/room-divider.js'
      - 'src/street*.js'
      - 'src/foliage.js'
      - 'src/harbor-garden.js'
      - 'src/mesh-index.js'
      - 'src/vehicle-art.js'
      - 'tools/test-travel.mjs'
      - 'src/terrace*.js'
      - 'tools/test-street.mjs'
      - 'tools/test-public-town.mjs'
      - 'tools/playtest-terrace.mjs'
      - 'tools/playtest-bluebell.mjs'
      - 'tools/test-nostr-relay.mjs'

permissions:
  contents: read

jobs:
  waterfront:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Each native WebRTC suite has its own job budget.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - signalling: local
            name: WebRTC with local signalling
          - signalling: public
            name: WebRTC with public signalling
          - signalling: travel
            name: Travel and pointer controls over WebRTC
          - signalling: recovery
            name: Private street backup and owner recovery
          - signalling: door
            name: Answer a private home visit
          - signalling: band
            name: Play live keyboards with an audience
          - signalling: furnishing
            name: Furnish an occupied home with a guest
          - signalling: lighting
            name: Link and operate home lighting with a guest
          - signalling: studio
            name: Place studio furniture and paint with a guest
          - signalling: flowers
            name: Pick and regrow roadside flowers with a neighbor
          - signalling: addresses
            name: Public address claims and host handover
          - signalling: players
            name: Player profiles and gestures
          - signalling: tabletop
            name: Shared tabletop game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/cozy-browser" --no-audit --no-fund playwright@1.58.2
          playwright="$RUNNER_TEMP/cozy-browser/node_modules/.bin/playwright"
          "$playwright" install chromium --only-shell
          # Hosted runners normally have the system libraries already. Probe the
          # pinned browser before requesting an expensive apt transaction.
          if ! node -e 'require(process.argv[1]).chromium.launch().then(b => b.close()).catch(e => { console.error(e); process.exitCode = 1; })' "$RUNNER_TEMP/cozy-browser/node_modules/playwright"; then
            "$playwright" install-deps chromium
          fi
      - name: Walk, renovate, undo and reconnect
        if: matrix.signalling == 'local' || matrix.signalling == 'public'
        env:
          SIGNALLING: ${{ matrix.signalling }}
        run: |
          export PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json"
          if [ "$SIGNALLING" = local ]; then
            npm run test:street -- --rtc-loopback
          else
            npm run test:street -- --relay
          fi
      - name: Meet in the public town and recover a private street
        if: matrix.signalling == 'local' || matrix.signalling == 'public'
        env:
          SIGNALLING: ${{ matrix.signalling }}
        run: |
          export PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json"
          if [ "$SIGNALLING" = local ]; then
            npm run test:lobby
          else
            npm run test:lobby -- --relay
          fi
      - name: Drive, cycle and use pointer controls with a friend
        if: matrix.signalling == 'travel'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:travel -- --software
      - name: Transfer a private street between browser profiles
        if: matrix.signalling == 'recovery'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:domestic -- --recovery --software
      - name: Reserve a house with another resident
        if: matrix.signalling == 'addresses'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:lobby -- --addresses
      - name: Place a desk and use its lamp with another player
        if: matrix.signalling == 'furnishing'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:domestic -- --furnishing --software
      - name: Flip a room switch and rewire its lamps
        if: matrix.signalling == 'lighting'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:domestic -- --lighting --software
      - name: Furnish a studio, paint and recover a print
        if: matrix.signalling == 'studio'
        run: |
          export PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json"
          npm run test:domestic -- --studio --software
          npm run test:lobby -- --studio
      - name: Clip and wear a roadside flower and water the cut bed
        if: matrix.signalling == 'flowers'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:lobby -- --flowers
      - name: Meet a named player and wave across rooms
        if: matrix.signalling == 'players'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:lobby -- --players
      - name: Admit one visitor while another waits outside
        if: matrix.signalling == 'door'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:lobby -- --door
      - name: Play a live duet and listen from the Moon Room
        if: matrix.signalling == 'band'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:lobby -- --band --software
      - name: Play a tabletop round and admit a spectator
        if: matrix.signalling == 'tabletop'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:domestic -- --table --software
      - name: Preserve failed client states
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: street-failure-${{ matrix.signalling }}
          path: |
            test-results/street-failure
            test-results/domestic/review.json
          if-no-files-found: ignore
