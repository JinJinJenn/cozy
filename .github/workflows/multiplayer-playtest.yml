name: Waterfront multiplayer playtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiplayer-playtest.yml'
      - 'packages/net/**'
      - 'index.html'
      - 'src/main.js'
      - 'src/public-town.js'
      - 'src/street*.js'
      - 'src/vehicle-art.js'
      - 'tools/test-travel.mjs'
      - 'src/terrace*.js'
      - 'tools/test-street.mjs'
      - 'tools/test-public-town.mjs'
      - 'tools/playtest-terrace.mjs'
      - 'tools/playtest-bluebell.mjs'
      - 'tools/test-nostr-relay.mjs'

permissions:
  contents: read

jobs:
  waterfront:
    name: WebRTC with ${{ matrix.signalling }} signalling
    runs-on: ubuntu-24.04
    # Browser package downloads can consume most of the old 12 minute job limit.
    # Gameplay assertions retain their individual timeouts.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        signalling: [local, public]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/cozy-browser" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/cozy-browser/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Walk, renovate, undo and reconnect
        env:
          SIGNALLING: ${{ matrix.signalling }}
        run: |
          export PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json"
          if [ "$SIGNALLING" = local ]; then
            npm run test:street -- --rtc-loopback
          else
            npm run test:street -- --relay
          fi
      - name: Meet in the public town and recover a private street
        env:
          SIGNALLING: ${{ matrix.signalling }}
        run: |
          export PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json"
          if [ "$SIGNALLING" = local ]; then
            npm run test:lobby
          else
            npm run test:lobby -- --relay
          fi
      - name: Drive, cycle and use pointer controls with a friend
        if: matrix.signalling == 'local'
        run: PLAYWRIGHT_FROM="$RUNNER_TEMP/cozy-browser/package.json" npm run test:travel
      - name: Preserve failed client states
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: street-failure-${{ matrix.signalling }}
          path: test-results/street-failure
          if-no-files-found: ignore
